
version: '3.8'
services:
  db:
    image : postgres
    restart : always
    environment:
      POSTGRES_USER : ${DB_USERNAME}
      POSTGRES_PASSWORD : ${DB_PASSWORD}
      POSTGRES_DB : ${DB_NAME}
    container_name: shopcontainerfull
    volumes:
      - .postgres:/var/lib/postgres/data
    ports:
      - ${DB_PORT}:5432