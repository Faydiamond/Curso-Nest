version: '3'

services:
  db:
    image: mysql:8.0 
    restart: always
    ports:
      - "3306:3306" 
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME} 
      MYSQL_PASSWORD: ${DB_PASSWORD}  
    container_name: teslodb
    volumes:
      - ./mysql:/var/lib/mysql # El volumen donde se almacenarán los datos de MySQL 